syntax = "proto2";

package planning.ssc;

message SscPlannerCfg {
  required double velocity_singularity_eps = 1;
  required double low_speed_threshold = 2;
  required double weight_proximity = 3;
  required bool is_fitting_only = 4;
  // MVP-6: 是否计算候选 QP 轨迹的风险暴露指标。默认关闭，保持 baseline。
  optional bool enable_risk_exposure_eval = 5 [default = false];
  // MVP-6: 是否允许按风险暴露软代价重选候选轨迹。默认关闭，不改变最终轨迹。
  optional bool enable_risk_exposure_reselect = 6 [default = false];
  // MVP-6: 风险暴露代价权重。0.0 时即使打开重选也退化为原始行为选择。
  optional double risk_exposure_weight = 7 [default = 0.0];
  // MVP-6: 风险重选切换裕度，只有风险候选比 baseline 明显更优才允许切换。
  optional double risk_exposure_switch_margin = 8 [default = 0.2];
  // MVP-6: 沿 Bezier 候选轨迹查询 risk grid 的时间采样间隔。
  optional double risk_exposure_sample_dt = 9 [default = 0.2];
  // MVP-6: 单点风险超过该阈值时计入 high_risk_hits。
  optional double risk_exposure_high_threshold = 10 [default = 0.5];
  // MVP-6: 候选轨迹风险暴露 CSV 输出路径，用于论文实验复现。
  optional string risk_exposure_csv_path = 11 [default = "/tmp/epsilon_mvp6_risk_exposure.csv"];
  // MVP-7: 是否启用场景自适应风险权重。默认 false 时保持 MVP-6 静态配置。
  optional bool enable_adaptive_risk_weight = 12 [default = false];
  // MVP-7: 高速场景判定阈值，单位 m/s。超过该速度时放大风险权重。
  optional double adaptive_high_speed_threshold = 13 [default = 12.0];
  // MVP-7: 高速场景风险权重倍率。
  optional double adaptive_high_speed_weight_scale = 14 [default = 1.5];
  // MVP-7: 变道场景风险权重倍率。
  optional double adaptive_lane_change_weight_scale = 15 [default = 1.3];
  // MVP-7: 候选风险峰值超过该阈值时认为进入高交互风险场景。
  optional double adaptive_high_risk_threshold = 16 [default = 0.6];
  // MVP-7: 高交互风险场景风险权重倍率。
  optional double adaptive_high_risk_weight_scale = 17 [default = 1.4];
  // MVP-7: 自适应后风险权重上限，避免配置叠乘导致过度保守。
  optional double adaptive_max_risk_weight = 18 [default = 20.0];
  // MVP-7: 自适应后切换裕度倍率，风险高时可降低裕度让系统更愿意避险。
  optional double adaptive_switch_margin_scale = 19 [default = 0.8];
  // MVP-8: 是否启用风险兜底安全过滤器。默认关闭，保持 MVP-7 行为。
  optional bool enable_safety_fallback = 20 [default = false];
  // MVP-8: 选中候选单点最大风险超过该阈值时触发保守兜底检查。
  optional double safety_fallback_max_risk_threshold = 21 [default = 0.85];
  // MVP-8: 选中候选总风险暴露超过该阈值时触发保守兜底检查。
  optional double safety_fallback_exposure_sum_threshold = 22 [default = 8.0];
  // MVP-8: 选中候选高风险采样点数量超过该阈值时触发保守兜底检查。
  optional int32 safety_fallback_high_risk_hits_threshold = 23 [default = 5];
  // MVP-8: 兜底候选至少需要比当前候选降低多少最大单点风险，才允许替换。
  optional double safety_fallback_min_risk_reduction = 24 [default = 0.1];
  // MVP-8: 是否优先使用 LaneKeeping 作为保守兜底候选。
  optional bool safety_fallback_prefer_lane_keeping = 25 [default = true];
  // 风险图多模态周车预测时长，单位 s。<=0 时自动使用 SSC map 的时间域。
  optional double multimodal_prediction_time = 26 [default = 0.0];
  // 风险图多模态周车预测采样间隔，单位 s。<=0 时自动使用 SSC map 的时间分辨率。
  optional double multimodal_prediction_step = 27 [default = 0.0];
}

message InflateSteps {
  required int32 x_p = 1;
  required int32 x_n = 2;
  required int32 y_p = 3;
  required int32 y_n = 4;
  required int32 z_p = 5;
  required int32 z_n = 6;
}

message DynamicBounds {
  required double max_lon_vel = 1;
  required double min_lon_vel = 2;
  required double max_lon_acc = 3;
  required double max_lon_dec = 4;
  required double max_lat_vel = 5;
  required double max_lat_acc = 6;
}

message SscMapCfg {
  required int32 map_size_x = 1;
  required int32 map_size_y = 2;
  required int32 map_size_z = 3;

  required double map_resl_x = 4;
  required double map_resl_y = 5;
  required double map_resl_z = 6;

  required double s_back_len = 7;
  required DynamicBounds dyn_bounds = 8;

  required int32 max_grids_along_time = 9;
  required InflateSteps infl_steps = 10;

  // MVP-5: 风险感知 corridor 开关。默认 false 时完全退化为原始 SSC binary map。
  optional bool enable_risk_aware_corridor = 11 [default = false];
  // MVP-5: risk grid 转 hard occupied 的阈值。风险值已截断到 [0,1]，
  // 因此默认 1.0 且使用 ">" 判断时不会新增占据格。
  optional double risk_occupied_threshold = 12 [default = 1.0];
}

message Config {
  required string name = 1;
  required string version = 2;
  required string status = 3;
  required SscPlannerCfg planner_cfg = 4;
  required SscMapCfg map_cfg = 5;
}
